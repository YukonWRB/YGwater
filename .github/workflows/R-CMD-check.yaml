# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 1

      - name: Set up PostgreSQL 18
        uses: ikalnytskyi/action-setup-postgres@v9
        with:
          postgres-version: '18'
          username: postgres
          password: postgres

      - name: Install PostGIS and the HEIC decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y postgis postgresql-18-postgis-3 postgresql-18-postgis-3-scripts libheif-plugin-libde265

      - name: Verify HEIC decoding in R
        run: Rscript -e 'invisible(magick::image_read("tests/testthat/fixtures/upload-sample.heic"))'

      - name: Bootstrap CI roles
        env:
          PGSERVICE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE admin NOLOGIN SUPERUSER;
          CREATE ROLE runner LOGIN SUPERUSER PASSWORD 'runner';
          GRANT admin TO runner;
          SQL

      - name: Restore and upgrade test database if necessary
        run: |
          Rscript -e 'AquaCache::restore_seed_db("tests/testthat/fixtures/test_db.sql.gz", "testdb", "127.0.0.1", 5432, "postgres", "postgres", nhn = FALSE)'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
